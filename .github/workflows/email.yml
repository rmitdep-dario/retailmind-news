name: Enviar email-resumo

# Dispara quando a recolha diária faz push a articles.json.
on:
  push:
    branches: [main]
    paths:
      - 'public/data/articles.json'
  workflow_dispatch:
    inputs:
      test:
        description: 'Modo teste: envia os 5 artigos mais recentes (para confirmar o envio)'
        type: boolean
        default: true

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # precisa do commit anterior para saber o que é novo
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Enviar resumo via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
          TEST_MODE: ${{ github.event.inputs.test }}
        run: node scripts/send-email.mjs
